name: Flutter CI

on:
  push:
    branches: [ "main", "feature/**", "fix/**", "release/**" ]
  pull_request:
    branches: [ "main" ]

# Cancel any in-progress run for the same branch/PR when a new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for changelog

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
        continue-on-error: true # Don't block APK build on test failures

      # ── Build APK ─────────────────────────────────────────────────
      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyMettle-${{ github.ref_name }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # ── Notify Teams via Power Automate webhook ────────────────────
      - name: Get commit messages
        id: changelog
        run: |
          CHANGES=$(git log --oneline -5 --pretty=format:"• %s" | head -c 500)
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Notify Teams channel
        if: success()
        run: |
          APK_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d @- <<PAYLOAD
          {
            "app": "🏋️ DailyMettle: Habit & Challenge",
            "branch": "${{ github.ref_name }}",
            "buildNumber": "#${{ github.run_number }}",
            "description": "New APK build generated from branch **${{ github.ref_name }}**",
            "changes": "${{ steps.changelog.outputs.changes }}",
            "triggeredBy": "${{ github.actor }}",
            "apkDownloadLink": "$APK_URL",
            "commitSha": "${{ github.sha }}"
          }
          PAYLOAD
